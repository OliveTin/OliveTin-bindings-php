name: Release Pipeline

# Default: least privilege. The release job overrides what it needs.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ROOT_VERSION: ${{ format('dev-{0}', github.head_ref || github.ref_name) }}
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.3'
          - '8.2'
          - '8.1'
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, json, libxml, mbstring, tokenizer, xml, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Setup Problem Matches
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Run phpstan
        run: make phpstan

      - name: Run phpcs
        run: make lint

      - name: Run test suite
        run: make tests

      - name: Composer audit (prefer-stable sanity check)
        if: matrix.php == '8.4' && matrix.dependency-version == 'prefer-stable'
        run: composer audit --no-interaction

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      COMPOSER_ROOT_VERSION: dev-${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: release
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 24.2.3 # https://github.com/cycjimmy/semantic-release-action/issues/243

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
